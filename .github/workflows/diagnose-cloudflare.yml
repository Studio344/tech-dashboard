name: Diagnose Cloudflare

# Read-only diagnosis of the summary pipeline (site-owner request 2026-11-27).
# Reads the summary Queue and its dead-letter queue, SUMMARY_CACHE KV
# operations, Worker invocation status and the summarizer's log events with
# the deploy token, so the owner can tell whether summary jobs are never
# processed or every KV write fails. See scripts/diagnose-cloudflare.mjs.
#
# Safety:
# - Runs only on workflow_dispatch, like Deploy Workers. A fork PR or an
#   ordinary merge never starts it or reads the secrets.
# - The script sends only GET requests and read-only queries. It deploys,
#   writes, purges and retries nothing.
# - The token and account id stay in env. The script never prints them and
#   redacts them from every error message.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back to read (1 to 72)"
        type: string
        default: "24"

permissions:
  contents: read

concurrency:
  group: tech-dashboard-cloudflare-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    name: read summary pipeline metrics
    if: github.repository == 'Studio344/tech-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-production
    steps:
      - name: Check branch
        run: |
          set -eu
          case "${GITHUB_REF}" in
            refs/heads/main | refs/heads/develop) ;;
            *)
              echo "::error::Diagnose Cloudflare runs from main or develop only."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Read Cloudflare metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSE_HOURS: ${{ inputs.hours }}
        run: node scripts/diagnose-cloudflare.mjs --hours "${DIAGNOSE_HOURS}"
