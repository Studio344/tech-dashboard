#:schema https://cloudflare.com/workers/wrangler-schema.json
# tech-dashboard-summarizer — Queue consumer Worker.
#
# Receives one entry per invocation from the SUMMARY_QUEUE producer Worker
# (tech-dashboard-harness), calls the Anthropic Claude API to generate the bilingual JSON
# summary, and writes the result to the SUMMARY_CACHE KV namespace.
#
# Split out from the harness Worker because the combined CPU cost of
# (long-form LLM JSON parse) + (publishHistoryFiles JSON aggregation)
# exceeded the default 30s per-invocation CPU cap (LL-037). The summarizer is
# intentionally quality-first: one queue message gets a longer timeout and
# output budget so the site can publish article-like summaries instead of thin
# notes. CPU limits are intentionally omitted because the current Cloudflare
# plan rejects per-Worker cpu_ms settings.

name = "tech-dashboard-summarizer"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# KV: same SUMMARY_CACHE as the harness Worker. Both bind to namespace id
# 6d67debb991742efadfec473a121f5fc.
[[kv_namespaces]]
binding = "SUMMARY_CACHE"
id = "6d67debb991742efadfec473a121f5fc"

[vars]
# Anthropic Claude API is the only backend (site-owner request 2026-11-26:
# GitHub Copilot is no longer used). Every model id must start with
# "claude-"; a non-Claude value fails the job with an explicit error.
SUMMARIZE_MODEL = "claude-opus-5-5"
SUMMARIZE_MODEL_FALLBACKS = ""
# Thinking depth (low | medium | high | xhigh | max). Summaries are short and
# structured, so medium keeps latency and cost moderate.
SUMMARIZE_EFFORT = "medium"
# Bound each attempt so a stalled response releases the queue slot.
SUMMARIZE_TIMEOUT_MS = "120000"
# max_tokens covers thinking + the visible JSON answer.
SUMMARIZE_MAX_TOKENS = "16000"

# Secrets (set via `npx wrangler secret put ANTHROPIC_API_KEY` in this
# directory):
#   - ANTHROPIC_API_KEY  Required. Without it every job fails with an explicit
#                        setup error and /health reports ok: false.
#                        See worker/src/anthropic-client.ts.

# Queue consumer. Process one entry per invocation so each summarize gets
# its own CPU budget; Cloudflare auto-retries on throw (up to max_retries).
# max_concurrency caps how many invocations run at once. Without it,
# Cloudflare auto-scales to 40+ which fan-outs simultaneous LLM API
# calls and causes upstream rate-limiting (every request AbortError).
# 2 keeps API pressure moderate while allowing slow, high-quality jobs to
# drain in parallel. Lower to 1 if the API starts rate-limiting long requests.
[[queues.consumers]]
queue = "tech-dashboard-summary"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
# Back off timed-out API calls instead of retrying immediately into the
# same upstream pressure window.
retry_delay = 120
max_concurrency = 2
dead_letter_queue = "tech-dashboard-summary-dlq"

[observability]
enabled = true
